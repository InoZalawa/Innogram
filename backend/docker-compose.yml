services:
  postgres:
    image: postgres:16-alpine
    container_name: innogram-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-Innogram}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innogram-network

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innogram-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innogram-backend
    environment:
      NODE_ENV: development
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: postgres
      DB_DATABASE: ${DB_DATABASE:-Innogram}
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-Innogram}?schema=public"
#     Zamiast jednej zmiennej, definiujemy dedykowane schematy:
      AUTH_DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-Innogram}?schema=auth"
      POSTS_DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?schema=posts&options=-csearch_path%3Dposts"      # Zostawiamy DATABASE_URL jako fallback (domyślnie dla auth)
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-Innogram}?schema=auth"
      JWT_KEY: ${JWT_KEY}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://backend:3001}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    ports:
      - "3001:3001" # Auth microservice
      - "3002:3002" # Posts microservice
      - "3003:3003" # Core microservice
    volumes:
      - ./apps:/app/apps
      - /app/node_modules
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./prisma.config.ts:/app/prisma.config.ts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - innogram-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:

networks:
  innogram-network:
    driver: bridge
